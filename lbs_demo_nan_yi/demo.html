<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色世界模拟器 — 南一高中</title>
<style>
:root{--bg:#2d5a27;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
      --accent:#58a6ff;--zhong:#4a90d9;--zhou:#e8734a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Helvetica Neue",sans-serif;background:#1a1d22;color:var(--text);overflow:hidden;height:100vh;display:flex;flex-direction:column}

/* === Top Bar === */
.topbar{height:48px;display:flex;align-items:center;padding:0 20px;background:#161b22;border-bottom:1px solid var(--border);gap:10px;flex-shrink:0}
.topbar h1{font-size:15px;font-weight:600}
.topbar .badge{font-size:10px;background:var(--accent);color:#fff;padding:2px 7px;border-radius:4px}
.topbar .time-big{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 10px rgba(88,166,255,.4);margin-left:12px}
.topbar .sep{flex:1}
.topbar button{background:#21262d;color:var(--text);border:1px solid var(--border);padding:5px 14px;border-radius:5px;cursor:pointer;font-size:12px;transition:.15s}
.topbar button:hover{border-color:var(--accent);color:var(--accent)}
.topbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.topbar button:disabled{opacity:.3;cursor:default}
.topbar select{background:#21262d;color:var(--text);border:1px solid var(--border);padding:5px;border-radius:5px;font-size:12px}
.topbar .info{color:var(--muted);font-size:12px}

/* === Main: Map left + Timeline right === */
.main-row{flex:1;display:grid;grid-template-columns:1fr 560px;overflow:hidden}

/* Map */
.map-wrap{position:relative;overflow:hidden;
  background:#3a7a32;
  background-image:radial-gradient(circle at 20% 80%,#2d6a25 0%,transparent 50%),
                   radial-gradient(circle at 80% 20%,#4a8a42 0%,transparent 40%)}
.campus{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:820px;height:520px}

.road{position:absolute;background:#c4b896;border:1px solid #a89a70}
.tree{position:absolute;width:14px;height:14px;border-radius:50%;background:#2a6a22;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.tree::after{content:'';position:absolute;width:3px;height:5px;background:#5a4020;bottom:-3px;left:5.5px;border-radius:1px}
.bld{position:absolute;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:2px 3px 8px rgba(0,0,0,.4);z-index:2;transition:.3s}
.bld .roof{position:absolute;top:-5px;left:-2px;right:-2px;height:7px;border-radius:3px 3px 0 0}
.bld .b-name{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:1;text-align:center}
.bld .b-sub{font-size:8px;color:rgba(255,255,255,.6);z-index:1}
.bld.active{box-shadow:0 0 20px rgba(88,166,255,.35);z-index:5}
.bld-teach{background:linear-gradient(135deg,#6a5a4a,#5a4a3a)}.bld-teach .roof{background:#8a7a6a}
.bld-admin{background:linear-gradient(135deg,#5a6a7a,#4a5a6a)}.bld-admin .roof{background:#7a8a9a}
.bld-lib{background:linear-gradient(135deg,#7a6a5a,#6a5a4a)}.bld-lib .roof{background:#9a8a7a}
.bld-cafe{background:linear-gradient(135deg,#8a6a4a,#7a5a3a)}.bld-cafe .roof{background:#aa8a6a}
.bld-canteen{background:linear-gradient(135deg,#6a6a5a,#5a5a4a)}.bld-canteen .roof{background:#8a8a7a}
.bld-shop{background:linear-gradient(135deg,#7a6a5a,#6a5a4a)}.bld-shop .roof{background:#9a8a7a}
.bld-gate{background:linear-gradient(135deg,#8a8a8a,#6a6a6a);border:2px solid #aaa}
.bld-roof-top{background:linear-gradient(135deg,#7a7a7a,#5a5a5a)}.bld-roof-top .roof{background:#9a9a9a}
.field{position:absolute;border-radius:6px;background:#5a8a4a;border:2px solid #fff;z-index:1}
.court{position:absolute;border:1.5px solid rgba(255,255,255,.6);border-radius:3px}
.court-circle{position:absolute;width:28px;height:28px;border:1.5px solid rgba(255,255,255,.6);border-radius:50%}
.track{position:absolute;border:1.5px solid rgba(255,255,255,.4);border-radius:40px}
.garden{position:absolute;border-radius:8px;background:linear-gradient(135deg,#4a8a40,#3a7a30);border:1px dashed rgba(255,255,255,.3);z-index:1}
.flower{position:absolute;width:5px;height:5px;border-radius:50%}

.map-avatar{position:absolute;z-index:10;display:flex;flex-direction:column;align-items:center;
  transition:left .8s ease,top .8s ease;pointer-events:none}
.av-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);border:2px solid #fff;position:relative}
.av-dot.z{background:var(--zhong)}.av-dot.w{background:var(--zhou)}
.av-dot .pulse{position:absolute;inset:-4px;border-radius:50%;border:2px solid;animation:pulse 2s infinite}
.av-dot.z .pulse{border-color:var(--zhong)}.av-dot.w .pulse{border-color:var(--zhou)}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.av-label{margin-top:3px;font-size:9px;font-weight:600;color:#fff;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:3px;white-space:nowrap}
.map-label{position:absolute;font-size:13px;color:rgba(255,255,255,.2);font-weight:700;z-index:0;pointer-events:none}

/* === Right Timeline Panel === */
.timeline-panel{background:#161b22;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.tl-header{padding:14px 20px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted);flex-shrink:0}
.tl-scroll{flex:1;overflow-y:auto;padding:0 20px 20px}

/* Timeline item */
.tl-tick{margin-top:16px}
.tl-tick-time{font-size:18px;font-weight:700;color:var(--accent);margin-bottom:10px}
.tl-tick-time.current{color:#fff;text-shadow:0 0 8px rgba(88,166,255,.5)}
.tl-entry{display:flex;gap:12px;margin-bottom:12px}
.tl-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;flex-shrink:0;margin-top:2px}
.tl-avatar.z{background:var(--zhong)}.tl-avatar.w{background:var(--zhou)}
.tl-body{flex:1;min-width:0}
.tl-name-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.tl-persona{font-size:14px;font-weight:600}
.tl-loc{font-size:11px;color:var(--muted)}
.tl-action{font-size:13px;line-height:1.6;color:var(--text)}
.tl-action.convo{color:var(--accent);font-style:italic}
.tl-line{width:2px;background:var(--border);margin:0 15px;flex-shrink:0}

.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;height:100%}
</style>
</head>
<body>

<div class="topbar">
  <h1>角色世界模拟器</h1><span class="badge">南一高中</span>
  <div class="time-big" id="timeDisplay">--:--</div>
  <div class="sep"></div>
  <button class="primary" id="btnLoad" onclick="loadData()">加载数据</button>
  <button id="btnPlay" onclick="play()" disabled>▶ 播放</button>
  <button id="btnPause" onclick="pause()" disabled>⏸</button>
  <button id="btnPrev" onclick="step(-1)" disabled>◀</button>
  <button id="btnNext" onclick="step(1)" disabled>▶</button>
  <select id="speedSel" onchange="setSpeed(this.value)">
    <option value="2500">慢速</option><option value="1200" selected>正常</option><option value="500">快速</option>
  </select>
  <span class="info" id="tickInfo">—</span>
</div>

<div class="main-row">
  <!-- Map -->
  <div class="map-wrap"><div class="campus" id="campus"></div></div>
  <!-- Timeline -->
  <div class="timeline-panel">
    <div class="tl-header">📜 活动时间轴</div>
    <div class="tl-scroll" id="tlScroll"><div class="empty">点击「加载数据」</div></div>
  </div>
</div>

<script>
const BLDS=[
  {id:"教学楼",cls:"bld-teach",x:60,y:50,w:170,h:100,label:"教学楼",sub:"高二三班 · 音乐教室"},
  {id:"行政楼",cls:"bld-admin",x:60,y:205,w:130,h:65,label:"行政楼",sub:"学生会 · 办公室"},
  {id:"图书馆",cls:"bld-lib",x:270,y:50,w:120,h:75,label:"📚 图书馆",sub:"阅读区 · 自习区"},
  {id:"食堂",cls:"bld-canteen",x:270,y:185,w:120,h:75,label:"🍜 食堂",sub:"一楼 · 二楼"},
  {id:"咖啡厅",cls:"bld-cafe",x:270,y:320,w:95,h:50,label:"☕ 咖啡厅",sub:""},
  {id:"天台",cls:"bld-roof-top",x:440,y:270,w:85,h:45,label:"🌙 天台",sub:""},
  {id:"小卖部",cls:"bld-shop",x:570,y:270,w:75,h:45,label:"🏪 小卖部",sub:""},
  {id:"校门口",cls:"bld-gate",x:610,y:410,w:110,h:45,label:"🚪 校门口",sub:""},
];
const FIELD={x:440,y:50,w:230,h:175};
const GARDEN={x:60,y:340,w:150,h:70};
const POS={};

function buildCampus(){
  const c=document.getElementById('campus');
  [[250,0,10,490],[0,170,820,8],[420,0,8,490],[0,305,440,6],[440,250,230,6]].forEach(([x,y,w,h])=>{
    const r=document.createElement('div');r.className='road';
    r.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;c.appendChild(r)});
  [[18,18],[230,28],[230,140],[18,170],[18,300],[415,310],[415,360],[690,45],[740,95],
   [690,185],[410,425],[500,425],[220,360],[220,420],[145,440],[375,440],[540,45],[540,185]].forEach(([x,y])=>{
    const t=document.createElement('div');t.className='tree';
    t.style.cssText=`left:${x}px;top:${y}px`;c.appendChild(t)});

  const f=document.createElement('div');f.className='field';
  f.style.cssText=`left:${FIELD.x}px;top:${FIELD.y}px;width:${FIELD.w}px;height:${FIELD.h}px`;
  f.innerHTML=`<div class="court" style="left:10px;top:10px;width:95px;height:${FIELD.h-20}px"></div>
    <div class="court-circle" style="left:42px;top:${(FIELD.h-28)/2}px"></div>
    <div class="track" style="left:125px;top:12px;width:90px;height:${FIELD.h-24}px"></div>
    <div style="position:absolute;left:18px;top:${FIELD.h/2-6}px;font-size:9px;color:rgba(255,255,255,.7);font-weight:700">🏀 篮球场</div>
    <div style="position:absolute;left:140px;top:${FIELD.h/2-6}px;font-size:9px;color:rgba(255,255,255,.5)">🏃 跑道</div>`;
  c.appendChild(f);POS["操场"]={x:FIELD.x+FIELD.w/2,y:FIELD.y+FIELD.h/2};

  const g=document.createElement('div');g.className='garden';
  g.style.cssText=`left:${GARDEN.x}px;top:${GARDEN.y}px;width:${GARDEN.w}px;height:${GARDEN.h}px`;
  g.innerHTML=`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,.8);font-weight:600">🌿 后门小花园</div>`;
  [[18,12,'#e88'],[45,50,'#ee8'],[90,15,'#e8e'],[120,45,'#8ef'],[70,58,'#fe8']].forEach(([x,y,col])=>{
    const fl=document.createElement('div');fl.className='flower';
    fl.style.cssText=`left:${x}px;top:${y}px;background:${col}`;g.appendChild(fl)});
  c.appendChild(g);POS["后门小花园"]={x:GARDEN.x+GARDEN.w/2,y:GARDEN.y+GARDEN.h/2};

  BLDS.forEach(b=>{
    const el=document.createElement('div');el.className=`bld ${b.cls}`;el.id='bld-'+b.id;
    el.style.cssText=`left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px`;
    el.innerHTML=`<div class="roof"></div><div class="b-name">${b.label}</div><div class="b-sub">${b.sub}</div>`;
    c.appendChild(el);POS[b.id]={x:b.x+b.w/2,y:b.y+b.h/2}});

  const lbl=document.createElement('div');lbl.className='map-label';
  lbl.style.cssText='left:330px;top:470px';lbl.textContent='南一高中';c.appendChild(lbl);

  [{cls:'z',name:'钟辰时',offset:-20},{cls:'w',name:'周往',offset:20}].forEach(a=>{
    const wrap=document.createElement('div');wrap.className='map-avatar';wrap.id=`avatar-${a.cls}`;
    wrap.innerHTML=`<div class="av-dot ${a.cls}"><span>${a.name[0]}</span><div class="pulse"></div></div><div class="av-label">${a.name}</div>`;
    wrap.style.cssText=`left:${POS["校门口"].x+a.offset-14}px;top:${POS["校门口"].y-22}px`;
    wrap.dataset.offset=a.offset;c.appendChild(wrap)});
}
buildCampus();

let data=[],ticks={},tickNums=[],currentIdx=-1,timer=null,speed=1200;
function setSpeed(v){speed=parseInt(v)}

async function loadData(){
  try{const r=await fetch('output/sim_log.json');data=await r.json()}catch(e){
    const inp=document.createElement('input');inp.type='file';inp.accept='.json';
    inp.onchange=ev=>{const rd=new FileReader();rd.onload=e2=>{data=JSON.parse(e2.target.result);processData()};rd.readAsText(ev.target.files[0])};
    inp.click();return}
  processData()}

function processData(){
  ticks={};data.forEach(d=>{if(!ticks[d.tick])ticks[d.tick]=[];ticks[d.tick].push(d)});
  tickNums=Object.keys(ticks).map(Number).sort((a,b)=>a-b);currentIdx=-1;
  ['btnPlay','btnNext','btnPrev'].forEach(id=>document.getElementById(id).disabled=false);
  document.getElementById('btnLoad').textContent='✓ 已加载';
  document.getElementById('tickInfo').textContent=`共 ${tickNums.length} 步`;
  buildTimeline();step(1)}

function clean(raw){
  if(!raw)return'idle';
  let s=raw.replace(/\(fallback\)\s*/,'');
  s=s.replace(/\[\(ID:\w+\)\s*[^\]]*?\]\s*Activity:\s*/g,'');
  s=s.replace(/\n\[\(ID:xxxxxx\)[^\]]*?\]\s*Activity:[^\n]*/g,'');
  s=s.replace(/\s*\([^)]{0,200}\)\s*$/,'');
  return s||'idle'}

function buildTimeline(){
  const container=document.getElementById('tlScroll');
  let html='';
  // Merge consecutive ticks with identical activities per persona
  let merged=[];  // [{startTick, endTick, time_start, time_end, entries:[{persona,action,sector,arena,emoji}]}]
  let prev={};    // persona -> last action string
  tickNums.forEach((tn,idx)=>{
    const entries=ticks[tn]||[];
    const time=entries[0]?.time||'--:--';
    let changed=false;
    entries.forEach(e=>{
      const act=clean(e.action);
      if(prev[e.persona]!==act)changed=true;
    });
    if(changed||merged.length===0){
      merged.push({startTick:tn,endTick:tn,time_start:time,time_end:time,entries});
      entries.forEach(e=>{prev[e.persona]=clean(e.action)});
    }else{
      merged[merged.length-1].endTick=tn;
      merged[merged.length-1].time_end=time;
    }
  });

  merged.forEach((m,mi)=>{
    const timeLabel=m.time_start===m.time_end?m.time_start:`${m.time_start} - ${m.time_end}`;
    html+=`<div class="tl-tick" id="tl-tick-${m.startTick}">`;
    html+=`<div class="tl-tick-time" id="tl-time-${m.startTick}">${timeLabel}</div>`;
    m.entries.forEach(e=>{
      const isZ=e.persona==='钟辰时';
      const action=clean(e.action);
      const isConvo=action.startsWith('conversing')||action.includes('对话')||action.includes('问候');
      const sector=e.sector||'校外';
      const arena=e.arena||'';
      html+=`<div class="tl-entry">
        <div class="tl-avatar ${isZ?'z':'w'}">${isZ?'钟':'周'}</div>
        <div class="tl-body">
          <div class="tl-name-row">
            <span class="tl-persona">${e.persona}</span>
            <span class="tl-loc">📍 ${sector}${arena?' · '+arena:''}</span>
          </div>
          <div class="tl-action ${isConvo?'convo':''}">${action.length>120?action.slice(0,120)+'…':action}</div>
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  container.innerHTML=html;
  // Store merged for highlight
  window._merged=merged}

function moveAvatar(cls,sector){
  const pos=POS[sector]||POS["校门口"];
  const av=document.getElementById(`avatar-${cls}`);
  const offset=parseInt(av.dataset.offset)||0;
  av.style.left=(pos.x+offset-14)+'px';av.style.top=(pos.y-22)+'px';
  BLDS.forEach(b=>{const el=document.getElementById('bld-'+b.id);
    if(b.id===sector)el.classList.add('active');else el.classList.remove('active')})}

function renderTick(tickNum){
  const entries=ticks[tickNum]||[];
  document.getElementById('timeDisplay').textContent=entries[0]?.time||'--:--';
  document.getElementById('tickInfo').textContent=`第 ${currentIdx+1} / ${tickNums.length} 步`;
  entries.forEach(e=>{moveAvatar(e.persona==='钟辰时'?'z':'w',e.sector||'校门口')});

  // Highlight current merged group
  if(window._merged){
    window._merged.forEach(m=>{
      const timeEl=document.getElementById(`tl-time-${m.startTick}`);
      const tickEl=document.getElementById(`tl-tick-${m.startTick}`);
      if(!timeEl||!tickEl)return;
      const isCurrent=tickNum>=m.startTick&&tickNum<=m.endTick;
      const isPast=tickNum>m.endTick;
      if(isCurrent){
        timeEl.classList.add('current');tickEl.style.opacity='1';
      }else if(isPast){
        timeEl.classList.remove('current');tickEl.style.opacity='.6';
      }else{
        timeEl.classList.remove('current');tickEl.style.opacity='.25';
      }
      if(isCurrent)tickEl.scrollIntoView({behavior:'smooth',block:'center'});
    });
  }}

function step(dir){const n=currentIdx+dir;if(n<0||n>=tickNums.length)return;currentIdx=n;renderTick(tickNums[currentIdx])}
function play(){document.getElementById('btnPlay').disabled=true;document.getElementById('btnPause').disabled=false;
  if(currentIdx<0)currentIdx=0;timer=setInterval(()=>{if(currentIdx>=tickNums.length-1){pause();return}step(1)},speed)}
function pause(){clearInterval(timer);timer=null;document.getElementById('btnPlay').disabled=false;document.getElementById('btnPause').disabled=true}
</script>
</body>
</html>
