<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色世界模拟器 — 南一高中</title>
<style>
:root{--bg:#2d5a27;--card:#1a1d22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
      --accent:#58a6ff;--zhong:#4a90d9;--zhou:#e8734a;--green:#3fb950}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Helvetica Neue",sans-serif;background:#1a1d22;color:var(--text);overflow:hidden;height:100vh}

.header{height:48px;display:flex;align-items:center;padding:0 20px;background:#161b22;border-bottom:1px solid var(--border);gap:12px}
.header h1{font-size:15px;font-weight:600}
.header .badge{font-size:11px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:4px}
.header .time-big{margin-left:auto;font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;
  text-shadow:0 0 12px rgba(88,166,255,.5)}

.controls{height:40px;display:flex;align-items:center;padding:0 20px;gap:6px;background:#161b22;border-bottom:1px solid var(--border)}
.controls button{background:#21262d;color:var(--text);border:1px solid var(--border);padding:4px 12px;border-radius:5px;cursor:pointer;font-size:11px;transition:.15s}
.controls button:hover{border-color:var(--accent);color:var(--accent)}
.controls button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.controls button:disabled{opacity:.3;cursor:default}
.controls select{background:#21262d;color:var(--text);border:1px solid var(--border);padding:4px;border-radius:5px;font-size:11px}
.controls .info{color:var(--muted);font-size:11px;margin-left:auto}

.main{display:grid;grid-template-columns:1fr 360px;height:calc(100vh - 88px)}

/* ===== Campus Map ===== */
.map-wrap{position:relative;overflow:hidden;background:#3a7a32;
  background-image:radial-gradient(circle at 20% 80%,#2d6a25 0%,transparent 50%),
                   radial-gradient(circle at 80% 20%,#4a8a42 0%,transparent 40%),
                   radial-gradient(circle at 50% 50%,#3a7a32 0%,#2d6a25 100%)}
.campus{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.95);width:820px;height:560px}

/* Roads */
.road{position:absolute;background:#c4b896;border:1px solid #a89a70}
.road-h{height:12px}.road-v{width:12px}

/* Grass patches */
.grass{position:absolute;border-radius:50%;opacity:.3}
.grass-1{background:#5a9a50}.grass-2{background:#4a8a40}

/* Trees */
.tree{position:absolute;width:16px;height:16px;border-radius:50%;background:#2a6a22;
  box-shadow:0 2px 4px rgba(0,0,0,.3)}
.tree::after{content:'';position:absolute;width:4px;height:6px;background:#5a4020;
  bottom:-4px;left:6px;border-radius:1px}

/* Buildings */
.bld{position:absolute;border-radius:4px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:default;transition:.3s;
  box-shadow:2px 3px 8px rgba(0,0,0,.4);overflow:visible;z-index:2}
.bld .roof{position:absolute;top:-6px;left:-3px;right:-3px;height:8px;border-radius:3px 3px 0 0}
.bld .b-name{font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:1;text-align:center;line-height:1.2}
.bld .b-sub{font-size:8px;color:rgba(255,255,255,.7);z-index:1}
.bld.active{box-shadow:0 0 20px rgba(88,166,255,.4);z-index:5}

/* Building colors */
.bld-teach{background:linear-gradient(135deg,#6a5a4a,#5a4a3a);}.bld-teach .roof{background:#8a7a6a}
.bld-admin{background:linear-gradient(135deg,#5a6a7a,#4a5a6a);}.bld-admin .roof{background:#7a8a9a}
.bld-lib{background:linear-gradient(135deg,#7a6a5a,#6a5a4a);}.bld-lib .roof{background:#9a8a7a}
.bld-cafe{background:linear-gradient(135deg,#8a6a4a,#7a5a3a);}.bld-cafe .roof{background:#aa8a6a}
.bld-canteen{background:linear-gradient(135deg,#6a6a5a,#5a5a4a);}.bld-canteen .roof{background:#8a8a7a}
.bld-shop{background:linear-gradient(135deg,#7a6a5a,#6a5a4a);}.bld-shop .roof{background:#9a8a7a}
.bld-gate{background:linear-gradient(135deg,#8a8a8a,#6a6a6a);border:2px solid #aaa}

/* 操场 special */
.field{position:absolute;border-radius:6px;background:#5a8a4a;border:2px solid #fff;z-index:1}
.court{position:absolute;border:1.5px solid rgba(255,255,255,.6);border-radius:3px}
.court-circle{position:absolute;width:30px;height:30px;border:1.5px solid rgba(255,255,255,.6);border-radius:50%}
.track{position:absolute;border:1.5px solid rgba(255,255,255,.4);border-radius:40px}

/* 天台 */
.bld-roof-top{background:linear-gradient(135deg,#7a7a7a,#5a5a5a);}.bld-roof-top .roof{background:#9a9a9a}

/* 花园 */
.garden{position:absolute;border-radius:8px;background:linear-gradient(135deg,#4a8a40,#3a7a30);
  border:1px dashed rgba(255,255,255,.3);z-index:1}
.flower{position:absolute;width:6px;height:6px;border-radius:50%}

/* Avatars on map */
.map-avatar{position:absolute;width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  color:#fff;z-index:10;transition:left .8s ease,top .8s ease;
  box-shadow:0 2px 8px rgba(0,0,0,.5)}
.map-avatar.z{background:var(--zhong);border:2px solid #fff}
.map-avatar.w{background:var(--zhou);border:2px solid #fff}
.map-avatar .pulse{position:absolute;inset:-4px;border-radius:50%;border:2px solid;animation:pulse 2s infinite}
.map-avatar.z .pulse{border-color:var(--zhong)}.map-avatar.w .pulse{border-color:var(--zhou)}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.6);opacity:0}}

/* Speech bubble */
.bubble{position:absolute;background:rgba(0,0,0,.85);color:#fff;font-size:9px;line-height:1.4;
  padding:6px 10px;border-radius:8px;max-width:180px;z-index:20;pointer-events:none;
  box-shadow:0 2px 12px rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
.bubble.show{opacity:1}
.bubble::after{content:'';position:absolute;bottom:-6px;left:20px;
  border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid rgba(0,0,0,.85)}

/* Label */
.map-label{position:absolute;font-size:9px;color:rgba(255,255,255,.5);z-index:1;pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.6)}

/* ===== Right Panel ===== */
.right{border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:#161b22}
.panel-title{padding:10px 14px;font-size:12px;font-weight:600;border-bottom:1px solid var(--border);
  color:var(--muted);letter-spacing:.5px}
.persona-cards{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.p-card{background:#21262d;border-radius:8px;padding:10px 12px;border:1px solid var(--border)}
.p-card.zhong{border-left:3px solid var(--zhong)}.p-card.zhou{border-left:3px solid var(--zhou)}
.p-card h3{font-size:12px;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.p-card .loc{font-size:10px;color:var(--muted);margin-bottom:3px}
.p-card .act{font-size:11px;line-height:1.5}
.timeline{flex:1;overflow-y:auto;padding:0 14px 14px}
.tl-item{display:flex;gap:6px;padding:6px 0;border-bottom:1px solid #21262d}
.tl-time{font-size:10px;color:var(--accent);font-weight:600;min-width:36px;padding-top:1px}
.tl-dot{width:7px;height:7px;border-radius:50%;margin-top:3px;flex-shrink:0}
.tl-dot.z{background:var(--zhong)}.tl-dot.w{background:var(--zhou)}
.tl-content{font-size:10px;color:var(--muted);line-height:1.4}
.tl-content .tl-name{font-weight:600;color:var(--text)}
.empty{display:flex;align-items:center;justify-content:center;height:80px;color:var(--muted);font-size:12px}
</style>
</head>
<body>

<div class="header">
  <h1>角色世界模拟器</h1><span class="badge">南一高中</span>
  <div class="time-big" id="timeDisplay">--:--</div>
</div>
<div class="controls">
  <button class="primary" id="btnLoad" onclick="loadData()">加载数据</button>
  <button id="btnPlay" onclick="play()" disabled>▶ 播放</button>
  <button id="btnPause" onclick="pause()" disabled>⏸</button>
  <button id="btnPrev" onclick="step(-1)" disabled>◀</button>
  <button id="btnNext" onclick="step(1)" disabled>▶</button>
  <select id="speedSel" onchange="setSpeed(this.value)">
    <option value="2500">慢速</option><option value="1200" selected>正常</option><option value="500">快速</option>
  </select>
  <span class="info" id="tickInfo">—</span>
</div>

<div class="main">
  <div class="map-wrap">
    <div class="campus" id="campus"></div>
  </div>
  <div class="right">
    <div class="panel-title">👤 当前状态</div>
    <div class="persona-cards" id="personaCards"><div class="empty">点击「加载数据」</div></div>
    <div class="panel-title">📜 活动轨迹</div>
    <div class="timeline" id="timeline"></div>
  </div>
</div>

<script>
// ======= Campus Layout =======
const BLDS=[
  {id:"教学楼",cls:"bld-teach",x:60,y:50,w:180,h:110,label:"教学楼",sub:"高二三班 · 音乐教室"},
  {id:"行政楼",cls:"bld-admin",x:60,y:220,w:140,h:70,label:"行政楼",sub:"学生会 · 办公室"},
  {id:"图书馆",cls:"bld-lib",x:280,y:50,w:130,h:80,label:"📚 图书馆",sub:"阅读区 · 自习区"},
  {id:"食堂",cls:"bld-canteen",x:280,y:200,w:130,h:80,label:"🍜 食堂",sub:"一楼 · 二楼窗口"},
  {id:"咖啡厅",cls:"bld-cafe",x:280,y:340,w:100,h:55,label:"☕ 咖啡厅",sub:"座位区"},
  {id:"天台",cls:"bld-roof-top",x:450,y:280,w:90,h:50,label:"🌙 天台",sub:"平台"},
  {id:"小卖部",cls:"bld-shop",x:580,y:280,w:80,h:50,label:"🏪 小卖部",sub:"店内"},
  {id:"校门口",cls:"bld-gate",x:620,y:440,w:120,h:50,label:"🚪 校门口",sub:""},
];
// 操场 and 花园 are special
const FIELD={x:450,y:50,w:240,h:180};
const GARDEN={x:60,y:370,w:160,h:80};

// Avatar target positions per sector (center of building)
const POS={};

function buildCampus(){
  const c=document.getElementById('campus');
  // Roads
  [[250,0,12,500],[0,180,820,10],[420,0,10,500],[0,320,440,8],[440,260,240,8]].forEach(([x,y,w,h])=>{
    const r=document.createElement('div');r.className='road';
    r.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;c.appendChild(r);
  });
  // Trees
  [[20,20],[230,30],[230,150],[20,180],[20,310],[420,320],[420,360],[700,50],[750,100],
   [700,200],[410,420],[500,420],[230,380],[230,430],[150,460],[380,460]].forEach(([x,y])=>{
    const t=document.createElement('div');t.className='tree';
    t.style.cssText=`left:${x}px;top:${y}px`;c.appendChild(t);
  });
  // 操场 (field)
  const f=document.createElement('div');f.className='field';
  f.style.cssText=`left:${FIELD.x}px;top:${FIELD.y}px;width:${FIELD.w}px;height:${FIELD.h}px`;
  f.innerHTML=`
    <div class="court" style="left:10px;top:10px;width:100px;height:${FIELD.h-20}px"></div>
    <div class="court-circle" style="left:45px;top:${(FIELD.h-30)/2}px"></div>
    <div class="track" style="left:130px;top:15px;width:95px;height:${FIELD.h-30}px"></div>
    <div style="position:absolute;left:20px;top:${FIELD.h/2-8}px;font-size:10px;color:rgba(255,255,255,.7);font-weight:700">🏀 篮球场</div>
    <div style="position:absolute;left:145px;top:${FIELD.h/2-8}px;font-size:10px;color:rgba(255,255,255,.6)">🏃 跑道</div>`;
  c.appendChild(f);
  POS["操场"]={x:FIELD.x+FIELD.w/2, y:FIELD.y+FIELD.h/2};

  // 花园
  const g=document.createElement('div');g.className='garden';
  g.style.cssText=`left:${GARDEN.x}px;top:${GARDEN.y}px;width:${GARDEN.w}px;height:${GARDEN.h}px`;
  g.innerHTML=`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,.8);font-weight:600">🌿 后门小花园</div>`;
  // Flowers
  [[20,15,'#e88'],[50,55,'#ee8'],[100,20,'#e8e'],[130,50,'#8ef'],[80,65,'#fe8']].forEach(([x,y,col])=>{
    const fl=document.createElement('div');fl.className='flower';
    fl.style.cssText=`left:${x}px;top:${y}px;background:${col}`;g.appendChild(fl);
  });
  c.appendChild(g);
  POS["后门小花园"]={x:GARDEN.x+GARDEN.w/2, y:GARDEN.y+GARDEN.h/2};

  // Buildings
  BLDS.forEach(b=>{
    const el=document.createElement('div');el.className=`bld ${b.cls}`;el.id='bld-'+b.id;
    el.style.cssText=`left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px`;
    el.innerHTML=`<div class="roof"></div><div class="b-name">${b.label}</div><div class="b-sub">${b.sub}</div>`;
    c.appendChild(el);
    POS[b.id]={x:b.x+b.w/2, y:b.y+b.h/2};
  });

  // Map labels
  [["南一高中",340,490]].forEach(([t,x,y])=>{
    const l=document.createElement('div');l.className='map-label';
    l.style.cssText=`left:${x}px;top:${y}px;font-size:14px;color:rgba(255,255,255,.25);font-weight:700`;
    l.textContent=t;c.appendChild(l);
  });

  // Create avatars
  ['z','w'].forEach(cls=>{
    const av=document.createElement('div');
    av.className=`map-avatar ${cls}`;av.id=`avatar-${cls}`;
    av.innerHTML=`<span>${cls==='z'?'钟':'周'}</span><div class="pulse"></div>`;
    av.style.cssText=`left:${POS["校门口"].x-14}px;top:${POS["校门口"].y-14}px`;
    c.appendChild(av);
  });
  // Bubbles
  ['z','w'].forEach(cls=>{
    const bb=document.createElement('div');
    bb.className='bubble';bb.id=`bubble-${cls}`;
    c.appendChild(bb);
  });
}
buildCampus();

// ======= Data & Playback =======
let data=[],ticks={},tickNums=[],currentIdx=-1,timer=null,speed=1200;
function setSpeed(v){speed=parseInt(v)}

async function loadData(){
  try{const r=await fetch('output/sim_log.json');data=await r.json()}catch(e){
    const inp=document.createElement('input');inp.type='file';inp.accept='.json';
    inp.onchange=ev=>{const rd=new FileReader();rd.onload=e2=>{data=JSON.parse(e2.target.result);processData()};rd.readAsText(ev.target.files[0])};
    inp.click();return}
  processData();
}

function processData(){
  ticks={};data.forEach(d=>{if(!ticks[d.tick])ticks[d.tick]=[];ticks[d.tick].push(d)});
  tickNums=Object.keys(ticks).map(Number).sort((a,b)=>a-b);currentIdx=-1;
  ['btnPlay','btnNext','btnPrev'].forEach(id=>document.getElementById(id).disabled=false);
  document.getElementById('btnLoad').textContent='✓ 已加载';
  document.getElementById('tickInfo').textContent=`共 ${tickNums.length} 步`;
  step(1);
}

function cleanAction(raw){
  if(!raw)return'idle';
  let s=raw.replace(/\(fallback\)\s*/,'');
  s=s.replace(/\[\(ID:\w+\)\s*[^\]]*?\]\s*Activity:\s*/g,'');
  s=s.replace(/\n\[\(ID:xxxxxx\)[^\]]*?\]\s*Activity:[^\n]*/g,'');
  if(s.length>120)s=s.slice(0,120)+'…';
  return s||'idle';
}

function moveAvatar(cls, sector, action){
  const pos=POS[sector]||POS["校门口"];
  const av=document.getElementById(`avatar-${cls}`);
  const offset=cls==='z'?-18:18;
  av.style.left=(pos.x+offset-14)+'px';
  av.style.top=(pos.y-14)+'px';
  // Bubble
  const bb=document.getElementById(`bubble-${cls}`);
  const short=cleanAction(action);
  if(short&&short!=='idle'){
    bb.textContent=(cls==='z'?'钟辰时':'周往')+': '+short.slice(0,60);
    bb.style.left=(pos.x+offset-20)+'px';
    bb.style.top=(pos.y-54)+'px';
    bb.classList.add('show');
  }else{bb.classList.remove('show')}
  // Highlight building
  BLDS.forEach(b=>{document.getElementById('bld-'+b.id).classList.toggle('active',b.id===sector)});
}

function renderTick(tickNum){
  const entries=ticks[tickNum]||[];
  document.getElementById('timeDisplay').textContent=entries[0]?.time||'--:--';
  document.getElementById('tickInfo').textContent=`第 ${currentIdx+1} / ${tickNums.length} 步`;

  let cardsHtml='';
  entries.forEach(e=>{
    const isZ=e.persona==='钟辰时';
    const cls=isZ?'zhong':'zhou';
    const action=cleanAction(e.action);
    moveAvatar(isZ?'z':'w', e.sector||'校门口', e.action);
    cardsHtml+=`<div class="p-card ${cls}">
      <h3>${e.emoji||'👤'} ${e.persona}</h3>
      <div class="loc">📍 ${e.sector||'校外'}${e.arena?' · '+e.arena:''}</div>
      <div class="act">${action}</div></div>`;
  });
  document.getElementById('personaCards').innerHTML=cardsHtml||'<div class="empty">无数据</div>';

  let tlHtml='';
  for(let i=currentIdx;i>=Math.max(0,currentIdx-20);i--){
    (ticks[tickNums[i]]||[]).forEach(e=>{
      const isZ=e.persona==='钟辰时';
      const act=cleanAction(e.action);
      const short=act.length>50?act.slice(0,50)+'…':act;
      tlHtml+=`<div class="tl-item"><div class="tl-time">${e.time}</div>
        <div class="tl-dot ${isZ?'z':'w'}"></div>
        <div class="tl-content"><span class="tl-name">${e.persona}</span> ${e.emoji||''} ${short}</div></div>`;
    });
  }
  document.getElementById('timeline').innerHTML=tlHtml;
}

function step(dir){const n=currentIdx+dir;if(n<0||n>=tickNums.length)return;currentIdx=n;renderTick(tickNums[currentIdx])}
function play(){document.getElementById('btnPlay').disabled=true;document.getElementById('btnPause').disabled=false;
  if(currentIdx<0)currentIdx=0;timer=setInterval(()=>{if(currentIdx>=tickNums.length-1){pause();return}step(1)},speed)}
function pause(){clearInterval(timer);timer=null;document.getElementById('btnPlay').disabled=false;document.getElementById('btnPause').disabled=true}
</script>
</body>
</html>
